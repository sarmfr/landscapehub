kind: wasmer.io/App.v0
owner: samson
name: landscapehub
package: .

debug: false

scaling:
  mode: single_concurrency

locality:
  regions:
    - us-socal1

volumes:
  - name: media
    mount: /app/storage/app/public

capabilities:
  database:
    engine: mysql
  instaboot:
    requests:
      - path: /

jobs:
  - name: migrate-and-seed-marketplace
    trigger: post-deployment
    retries: 1
    timeout: 10m
    action:
      execute:
        command: php
        cli_args:
          - /app/artisan
          - migrate
          - --force
          - --seed
